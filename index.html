<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Timetable">
<title>Timetable</title>
<style>
  :root {
    --bg:#fff; --text:#111; --muted:#8e8e93; --line:#e3e3e6; --weekend:#f4f4f5;
    --accent:#e0533d; --sheet:#fff; --soft:#f2f2f7; --prayer:#0f8a6c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { --bg:#000; --text:#f2f2f2; --line:#2c2c2e; --weekend:#111113; --sheet:#1c1c1e; --soft:#2c2c2e; --prayer:#38c9a3; }
  }
  :root[data-theme=dark] { --bg:#000; --text:#f2f2f2; --line:#2c2c2e; --weekend:#111113; --sheet:#1c1c1e; --soft:#2c2c2e; --prayer:#38c9a3; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); overflow:hidden; }
  button { font:inherit; }

  /* Header */
  header { padding:10px 14px 4px; }
  .row1 { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .title { font-size:clamp(24px,5vw,40px); letter-spacing:-.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title b { font-weight:800; } .title span { font-weight:400; }
  .row2 { display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .seg { display:inline-flex; background:var(--soft); border-radius:9px; padding:2px; }
  .seg button { border:none; background:none; padding:5px 12px; border-radius:7px; font-size:14px; color:var(--text); cursor:pointer; }
  .seg button.on { background:var(--bg); box-shadow:0 1px 3px rgba(0,0,0,.15); font-weight:600; }
  .btn-link { background:none; border:none; color:var(--accent); font-size:17px; padding:6px 8px; cursor:pointer; }
  .icon-btn { background:none; border:none; color:var(--accent); font-size:20px; padding:4px 8px; cursor:pointer; line-height:1; }
  .spacer { flex:1; }
  .info { font-size:12px; color:var(--muted); white-space:nowrap; }
  .info .np { color:var(--prayer); font-weight:600; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:16px;
    padding:4px 11px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .chip.on { border-color:transparent; background:var(--text); color:var(--bg); }
  .chip .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* Month */
  #main { flex:1; min-height:0; display:flex; flex-direction:column; }
  .weekdays { display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line); }
  .weekdays div { text-align:right; padding:5px 8px; font-size:clamp(12px,2.3vw,19px); font-weight:500; }
  .weekdays div.we { color:var(--muted); }
  .grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(7,1fr); min-height:0; }
  .cell { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:3px 3px 2px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column; min-height:74px; }
  .cell:nth-child(7n) { border-right:none; }
  .cell.we { background:var(--weekend); }
  .cell.empty { cursor:default; }
  .num { align-self:flex-end; font-size:clamp(13px,2.5vw,23px); font-weight:500; width:1.7em; height:1.7em;
    display:flex; align-items:center; justify-content:center; border-radius:50%; margin-bottom:1px; flex:none; }
  .cell.we .num { color:var(--muted); }
  .cell.today .num { background:var(--accent); color:#fff; }
  .items { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin; text-align:center; font-size:clamp(8px,1.35vw,13px); line-height:1.3; }
  .items .pl { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .items .sec { padding:2px 0; }
  .items .sec + .sec { border-top:1px solid var(--line); margin-top:2px; padding-top:3px; }
  .tm { font-family:ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif; font-weight:500;
    font-variant-numeric:tabular-nums; opacity:.9; }
  .items .tm { font-size:.78em; }
  .done { text-decoration:line-through; opacity:.4; }

  /* Week */
  .week { flex:1; min-height:0; display:flex; flex-direction:column; }
  .wk-head, .wk-all { display:grid; grid-template-columns:44px repeat(7,1fr); border-bottom:1px solid var(--line); }
  .wk-head div { text-align:center; padding:4px 0; font-size:12px; cursor:pointer; }
  .wk-head div b { display:block; font-size:18px; font-weight:500; }
  .wk-head div.we { color:var(--muted); }
  .wk-head div.today b { color:#fff; background:var(--accent); border-radius:50%; width:30px; height:30px; line-height:30px; margin:0 auto; }
  .wk-all > div { min-height:20px; border-left:1px solid var(--line); padding:2px; font-size:10px; }
  .wk-all > div:first-child { border:none; font-size:9px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .wk-body { flex:1; overflow-y:auto; position:relative; }
  .wk-grid { display:grid; grid-template-columns:44px repeat(7,1fr); position:relative; }
  .wk-hours div { height:var(--h); font-size:10px; color:var(--muted); text-align:right; padding-right:4px; transform:translateY(-6px); }
  .wk-col { position:relative; border-left:1px solid var(--line);
    background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% var(--h); }
  .wk-col.we { background-color:var(--weekend); }
  .blk { position:absolute; left:2px; right:2px; border-radius:6px; padding:2px 4px; font-size:10px; line-height:1.25;
    overflow:hidden; cursor:pointer; color:#fff; z-index:1; }
  .blk .tm { font-size:.9em; display:block; }
  .pr { position:absolute; left:0; right:0; border-top:1px dashed var(--prayer); pointer-events:none; }
  .pr span { position:absolute; right:1px; top:-11px; font-size:8px; color:var(--prayer); background:var(--bg); padding:0 2px; border-radius:3px; }
  .pr i { font-style:normal; }
  @media (max-width:699px) { .pr i { display:none; } }
  .now { position:absolute; left:0; right:0; border-top:2px solid var(--accent); pointer-events:none; z-index:2; }
  .allblk { border-radius:4px; color:#fff; padding:1px 3px; margin-bottom:2px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Sheet */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:10; }
  .overlay.open { display:block; }
  .sheet { position:fixed; left:0; right:0; bottom:0; max-height:88dvh; background:var(--sheet);
    border-radius:16px 16px 0 0; transform:translateY(100%); transition:transform .25s ease; z-index:11;
    display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  .sheet.open { transform:translateY(0); }
  @media (min-width:700px) {
    .sheet { inset:0; margin:auto; width:min(560px,92vw); height:fit-content; max-height:86dvh; border-radius:16px;
      transform:scale(.96); opacity:0; pointer-events:none; transition:transform .2s ease, opacity .2s ease; }
    .sheet.open { transform:scale(1); opacity:1; pointer-events:auto; }
  }
  .sheet-head { display:grid; grid-template-columns:80px 1fr 80px; align-items:center; padding:10px 8px; border-bottom:1px solid var(--line); }
  .sheet-head h2 { margin:0; font-size:17px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-head .btn-link:last-child { justify-self:end; }
  .sheet-body { overflow-y:auto; min-height:0; padding:12px 16px 20px; -webkit-overflow-scrolling:touch; }

  .prayers { display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none; }
  .prayers div { flex:1; min-width:56px; background:var(--soft); border-radius:10px; padding:6px 4px; text-align:center; font-size:11px; color:var(--muted); }
  .prayers div b { display:block; color:var(--prayer); font-size:13px; font-weight:600; }
  .prayers div.next { outline:2px solid var(--prayer); }

  .entry { background:var(--soft); border-radius:12px; padding:10px 12px; margin-bottom:10px; border-left:6px solid #999; }
  .entry .top { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700; cursor:pointer; }
  .entry .top small { font-weight:400; color:var(--muted); font-size:12px; }
  .entry .edit { color:var(--accent); font-weight:500; font-size:14px; }
  .chk { display:flex; align-items:flex-start; gap:8px; padding:5px 0; cursor:pointer; font-size:15px; }
  .chk input { width:20px; height:20px; margin:0; flex:none; accent-color:var(--accent); }
  .entry .note { margin-top:4px; color:var(--muted); font-size:14px; white-space:pre-wrap; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .empty-msg { color:var(--muted); text-align:center; padding:14px 0; }

  .primary { width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px; font-size:17px; font-weight:600; padding:13px; cursor:pointer; }
  .primary:disabled { opacity:.4; cursor:default; }
  .secondary { width:100%; background:var(--soft); color:var(--text); border:none; border-radius:12px; font-size:16px; padding:12px; cursor:pointer; margin-top:8px; }
  .danger { width:100%; background:none; color:#ff3b30; border:none; font-size:16px; padding:12px; cursor:pointer; margin-top:4px; }
  .two { display:flex; gap:8px; } .two > * { flex:1; }
  .lbl, .sheet-body > label, .sheet-body .row label { display:block; font-size:12px; color:var(--muted); margin:14px 0 5px; text-transform:uppercase; letter-spacing:.3px; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); }
  textarea { min-height:64px; resize:vertical; }
  .row { display:flex; gap:10px; } .row > * { flex:1; min-width:0; }
  .task-row { display:flex; gap:6px; margin-bottom:6px; }
  .task-row button, .place-row button { background:none; border:none; color:#ff3b30; font-size:22px; cursor:pointer; padding:0 6px; }
  .add-small { background:none; border:none; color:var(--accent); font-size:15px; padding:6px 0; cursor:pointer; }
  .days { display:flex; gap:4px; } .days button { flex:1; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:8px; padding:7px 0; font-size:13px; cursor:pointer; }
  .days button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .quick button { border:1px dashed var(--line); background:none; border-radius:14px; padding:5px 10px; font-size:13px; cursor:pointer; }
  .place-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .place-row input[type=color] { width:42px; height:36px; padding:2px; flex:none; }
  .box { background:var(--soft); border-radius:12px; padding:12px; margin-top:10px; font-size:15px; line-height:1.45; }
  .warn { color:var(--accent); font-weight:600; }
  .prow { display:grid; grid-template-columns:72px 1fr; align-items:start; gap:8px; padding:6px 0; }
  .prow b { padding-top:11px; color:var(--prayer); }
  .res { padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .res small { color:var(--muted); display:block; }

  .toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(200%);
    background:#222; color:#fff; border-radius:12px; padding:10px 14px; display:flex; gap:14px; align-items:center;
    z-index:30; transition:transform .2s ease; max-width:92vw; font-size:15px; box-shadow:0 4px 20px rgba(0,0,0,.3); }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast button { background:none; border:none; color:#ffb19f; font-weight:700; font-size:15px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <div class="row1">
    <div class="title"><b id="mName"></b> <span id="yName"></span></div>
    <button class="btn-link" id="today">Today</button>
  </div>
  <div class="row2">
    <div class="seg"><button id="vMonth" class="on">Month</button><button id="vWeek">Week</button></div>
    <button class="icon-btn" id="prev" aria-label="Previous">‹</button>
    <button class="icon-btn" id="next" aria-label="Next">›</button>
    <span class="spacer"></span>
    <button class="icon-btn" id="searchBtn" aria-label="Search">🔍</button>
    <button class="icon-btn" id="remBtn" aria-label="Reminders">🔔</button>
    <button class="icon-btn" id="setBtn" aria-label="Places and settings">🎨</button>
  </div>
  <div class="row2" style="margin-top:2px">
    <span class="info" id="nextPrayer"></span><span class="spacer"></span><span class="info" id="sync">Saved on this device</span>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div id="main"></div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog">
  <div class="sheet-head">
    <button class="btn-link" id="sheetBack" style="visibility:hidden">‹ Back</button>
    <h2 id="sheetTitle"></h2>
    <button class="btn-link" id="sheetClose">Done</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Undo</button></div>

<script>
/* ================= Data ================= */
const KEY = 'timetable-v1', UIKEY = 'timetable-ui';
const DEFAULT = { places: [
  { id:'p1', name:'PUA', color:'#6a9a3a', remind:null },
  { id:'p2', name:'Mounir', color:'#2350c8', remind:null },
  { id:'p3', name:'Yoga', color:'#b13ee0', remind:null } ], entries: [], updated: 0 };

function normalize(d) {
  d = d && d.places ? d : JSON.parse(JSON.stringify(DEFAULT));
  d.entries = (d.entries || []).map(e => ({ tasks:[], note:'', start:'', end:'', remind:null, repeat:null,
    skip:[], extra:[], done:{}, ...e }));
  d.places.forEach(p => { if (p.remind === undefined) p.remind = null; });
  d.prayerRemind = d.prayerRemind || {};
  d.updated = d.updated || 0;
  return d;
}
const clone = o => JSON.parse(JSON.stringify(o));
let db = (() => { try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return normalize(null); } })();
let ui = (() => { try { return { mode:'month', filter:[], ...JSON.parse(localStorage.getItem(UIKEY)) }; } catch (e) { return { mode:'month', filter:[] }; } })();
const saveUI = () => { try { localStorage.setItem(UIKEY, JSON.stringify({ mode:ui.mode, filter:ui.filter })); } catch (e) {} };
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function persist() { db.updated = Date.now(); saveLocal(); schedulePush(); }
const uid = () => Math.random().toString(36).slice(2, 10);

/* ================= Helpers ================= */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];          // columns, week starts Saturday
const COL2DOW = [6,0,1,2,3,4,5];                                     // column -> JS getDay()
const WEEKEND = new Set([0, 6]);                                     // Sat & Fri columns
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const isoOf = dt => iso(dt.getFullYear(), dt.getMonth(), dt.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return isoOf(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const place = id => db.places.find(p => p.id === id) || { name:'Other', color:'#888' };
const todayIso = () => isoOf(new Date());
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };

function fmtTime(t) {
  if (!t) return '';
  let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`;
}
function fmtRange(s, e) {
  if (!s) return ''; if (!e) return fmtTime(s);
  const a = fmtTime(s), b = fmtTime(e);
  return a.slice(-2) === b.slice(-2) ? a.slice(0, -2) + '-' + b : a + '-' + b;
}
const longDate = s => parse(s).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
const shortDate = s => parse(s).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
const UNITS = [[10080,'week'],[1440,'day'],[60,'hour'],[1,'min']];
function remindLabel(m, zero = 'At start time') {
  if (m == null) return 'No reminder';
  if (m === 0) return zero;
  for (const [u, n] of UNITS) if (m % u === 0) { const k = m / u; return `${k} ${n}${k > 1 && n !== 'min' ? 's' : ''} before`; }
}
const REMIND_OPTS = [null, 0, 5, 10, 15, 30, 60, 120, 1440, 2880, 10080];
const PRAYER_OPTS = [null, 0, 5, 10, 15, 20, 30];
// Reminder picker: preset list + "Custom…" (number + minutes/hours/days/weeks)
function remindPicker(id, val, presets = REMIND_OPTS, zero) {
  const custom = val != null && !presets.includes(val);
  let n = '', u = 1;
  if (custom) for (const [unit] of UNITS) if (val % unit === 0) { n = val / unit; u = unit; break; }
  return `<select id="${id}" class="rp">${presets.map(o => `<option value="${o}" ${!custom && o === val ? 'selected' : ''}>${remindLabel(o, zero)}</option>`).join('')}
      <option value="custom" ${custom ? 'selected' : ''}>Custom…</option></select>
    <div id="${id}C" class="row" style="margin-top:8px;${custom ? '' : 'display:none'}">
      <input type="number" inputmode="numeric" min="1" id="${id}N" value="${n}" placeholder="e.g. 3">
      <select id="${id}U">${[[1,'minutes'],[60,'hours'],[1440,'days'],[10080,'weeks']].map(([v, l]) => `<option value="${v}" ${v === u ? 'selected' : ''}>${l} before</option>`).join('')}</select>
    </div>`;
}
function wirePicker(id) {
  const sel = document.getElementById(id);
  sel.addEventListener('change', () => {
    const c = sel.value === 'custom';
    document.getElementById(id + 'C').style.display = c ? '' : 'none';
    if (c) document.getElementById(id + 'N').focus();
  });
}
function readPicker(id) {   // null = none, number = minutes, undefined = invalid custom value
  const v = document.getElementById(id).value;
  if (v === 'null') return null;
  if (v !== 'custom') return +v;
  const n = parseFloat(document.getElementById(id + 'N').value);
  if (!(n > 0)) return undefined;
  return Math.round(n * +document.getElementById(id + 'U').value);
}
const setPicker = (id, val, presets = REMIND_OPTS) => {
  const sel = document.getElementById(id);
  if (val == null || presets.includes(val)) { sel.value = String(val); document.getElementById(id + 'C').style.display = 'none'; }
};

/* ================= Repeats ================= */
function occurs(e, date) {
  if (!e.repeat) return e.date === date;
  if (e.skip.includes(date)) return false;
  if (e.extra.includes(date)) return true;
  if (date < e.date) return false;
  if (e.repeat.until && date > e.repeat.until) return false;
  const d = parse(date);
  if (e.repeat.freq === 'daily') return true;
  if (e.repeat.freq === 'weekly') return (e.repeat.days || []).includes(d.getDay());
  if (e.repeat.freq === 'monthly') return d.getDate() === parse(e.date).getDate();
  return false;
}
const visible = e => !ui.filter.length || ui.filter.includes(e.placeId);
function entriesFor(date, all) {
  return db.entries.filter(e => occurs(e, date) && (all || visible(e)))
    .sort((a, b) => (a.start || '99').localeCompare(b.start || '99'));
}
const doneSet = (e, date) => new Set(e.done[date] || []);
function repeatText(r) {
  if (!r) return '';
  if (r.freq === 'daily') return 'Every day';
  if (r.freq === 'monthly') return 'Every month';
  const names = COL2DOW.map((dow, i) => r.days.includes(dow) ? DAYS[i] : null).filter(Boolean);
  return 'Every ' + (names.length === 7 ? 'day' : names.join(', '));
}

/* ================= Prayer times (Alexandria, Egyptian General Authority) ================= */
const LAT = 31.2001, LNG = 29.9187, FAJR = 19.5, ISHA = 17.5;
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
function cairoOffset(y, m, d) {   // hours; follows Egypt's summer/winter time automatically
  const t = new Date(Date.UTC(y, m, d, 12));
  const loc = new Date(t.toLocaleString('en-US', { timeZone:'Africa/Cairo' }));
  const utc = new Date(t.toLocaleString('en-US', { timeZone:'UTC' }));
  return Math.round((loc - utc) / 36e5 * 4) / 4;
}
function sunPos(jd) {
  const D = jd - 2451545.0, g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
  const L = fix(q + 1.915 * Math.sin(rad(g)) + 0.020 * Math.sin(rad(2 * g)), 360), e = 23.439 - 0.00000036 * D;

const prayerCache = {};

    const dec = sunPos(jd0 + t).decl;
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(dec)) * Math.sin(rad(LAT))) / (Math.cos(rad(dec)) * Math.cos(rad(LAT))))) / 15;

  for (let i = 0; i < 2; i++) {
    const f = k => t[k] / 24;
    t = { fajr:angleTime(FAJR, f('fajr'), true), sunrise:angleTime(0.833, f('sunrise'), true), dhuhr:noon(f('dhuhr')),
          asr:asrTime(f('asr')), maghrib:angleTime(0.833, f('maghrib')), isha:angleTime(ISHA, f('isha')) };
  }

  for (const k in t) { const mins = Math.round((t[k] + tz - LNG / 15) * 60); out[k] = `${pad(Math.floor(mins / 60) % 24)}:${pad(mins % 60)}`; }

const PRAYERS = [['fajr','Fajr'],['sunrise','Sunrise'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];

  for (let off = 0; off < 2; off++) {
    const date = addDays(todayIso(), off), pt = prayerTimes(date);
    for (const [k, name] of PRAYERS) if (k !== 'sunrise' && (off || toMin(pt[k]) > n)) return { k, name, time: pt[k], date };

}

let cursor = new Date(); cursor.setHours(0, 0, 0, 0);
const main = document.getElementById('main');

function cellItems(date) {

function renderMonth() {
  const y = cursor.getFullYear(), m = cursor.getMonth();

const H = 46, START_H = 3;   // px per hour, first hour shown
function weekStart() { const d = new Date(cursor); d.setDate(d.getDate() - (d.getDay() + 1) % 7); return isoOf(d); }

  const s = parse(ws), e = parse(dates[6]), same = s.getMonth() === e.getMonth();
  document.getElementById('mName').textContent = same ? MONTHS[s.getMonth()] : `${s.getDate()} ${MONTHS[s.getMonth()].slice(0, 3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0, 3)}`;
  document.getElementById('yName').textContent = same ? `${s.getDate()}–${e.getDate()}, ${e.getFullYear()}` : e.getFullYear();
  const pos = t => (toMin(t) / 60 - START_H) * H;
  let head = '<div></div>', all = '<div>all-day</div>', cols = '';
  dates.forEach((date, i) => {
    const d = parse(date), we = WEEKEND.has(i) ? ' we' : '';
    head += `<div class="${we}${date === today ? ' today' : ''}" data-date="${date}">${DAYS[i]}<b>${d.getDate()}</b></div>`;
    let a = '', c = '';
    entriesFor(date).forEach(en => {
      const p = place(en.placeId);
      if (!en.start) { a += `<div class="allblk" style="background:${esc(p.color)}" data-date="${date}" data-id="${en.id}">${esc(p.name)}</div>`; return; }
      const top = Math.max(0, pos(en.start)), end = en.end ? pos(en.end) : top + H;
      const tasks = en.tasks.filter(Boolean).map(esc).join(', ');
      c += `<div class="blk" style="top:${top}px;height:${Math.max(22, end - top - 2)}px;background:${esc(p.color)}" data-date="${date}" data-id="${en.id}"><b>${esc(p.name)}</b><span class="tm">${fmtRange(en.start, en.end)}</span>${tasks}</div>`;
    });
    const pt = prayerTimes(date);
    PRAYERS.forEach(([k, name]) => { if (k !== 'sunrise') c += `<div class="pr" style="top:${pos(pt[k])}px"><span><i>${name} </i>${fmtTime(pt[k])}</span></div>`; });
    if (date === today) { const n = new Date(); c += `<div class="now" style="top:${((n.getHours() + n.getMinutes() / 60) - START_H) * H}px"></div>`; }

function shift(dir) {

function bindSwipe(el) {

  el.addEventListener('touchend', e => {

/* ================= Sheet + toast ================= */
const sheet = document.getElementById('sheet'), overlay = document.getElementById('overlay');
const body = document.getElementById('sheetBody'), titleEl = document.getElementById('sheetTitle'), backBtn = document.getElementById('sheetBack');
let backAction = null, sheetMode = null, sheetDay = null;
function showSheet(title, html, back, mode) {
  titleEl.textContent = title; body.innerHTML = html; body.scrollTop = 0; sheetMode = mode || 'other';
  backAction = back || null; backBtn.style.visibility = back ? 'visible' : 'hidden';
  sheet.classList.add('open'); overlay.classList.add('open');
}
function closeSheet() { sheet.classList.remove('open'); overlay.classList.remove('open'); sheetMode = null; render(); }
overlay.onclick = closeSheet;

let toastTimer;
function toast(msg, undoFn, ms = 6000) {
  const t = document.getElementById('toast'), b = document.getElementById('toastBtn');
  document.getElementById('toastMsg').textContent = msg;
  b.style.display = undoFn ? '' : 'none';
  b.onclick = () => { undoFn(); t.classList.remove('show'); };
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
// Make a change that can be undone from the toast
function withUndo(msg, change, after) {
  const before = JSON.stringify(db);
  change(); persist(); render(); after && after();
  toast(msg, () => { db = normalize(JSON.parse(before)); persist(); render(); if (sheetMode === 'day') openDay(sheetDay); else if (sheetMode) closeSheet(); }, 8000);
}

/* ================= Day view ================= */
function openDay(date) {
  sheetDay = date;
  const pt = prayerTimes(date), np = nextPrayer();
  let html = '<div class="prayers">' + PRAYERS.map(([k, n]) =>
    `<div class="${np && np.date === date && np.k === k ? 'next' : ''}">${n}${db.prayerRemind[k] != null ? ' 🔔' : ''}<b>${fmtTime(pt[k])}</b></div>`).join('') + '</div>';
  const list = entriesFor(date, true);
  if (!list.length) html += '<div class="empty-msg">Nothing planned yet.</div>';
  list.forEach(e => {
    const p = place(e.placeId), done = doneSet(e, date);
    html += `<div class="entry" style="border-left-color:${esc(p.color)}">
      <div class="top" data-edit="${e.id}"><span><span style="color:${esc(p.color)}">${esc(p.name)}</span>
        <span class="tm" style="color:${esc(p.color)}">${fmtRange(e.start, e.end)}</span>
        ${e.repeat ? `<small>↻ ${repeatText(e.repeat)}</small>` : ''}</span><span class="edit">Edit</span></div>
      ${e.tasks.map((t, i) => t ? `<label class="chk"><input type="checkbox" data-e="${e.id}" data-i="${i}" ${done.has(i) ? 'checked' : ''}><span class="${done.has(i) ? 'done' : ''}">${esc(t)}</span></label>` : '').join('')}
      ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
      ${e.remind != null ? `<div class="meta">🔔 ${remindLabel(e.remind)}</div>` : ''}
    </div>`;
  });
  html += `<button class="primary" id="addEntry">+ Add</button>`;
  const missing = db.entries.filter(e => e.repeat && !occurs(e, date));
  if (missing.length) html += `<div class="lbl">Add a repeating item to this day only</div><div class="quick">` +
    missing.map(e => `<button data-q="${e.id}" style="color:${esc(place(e.placeId).color)}">+ ${esc(place(e.placeId).name)} ${fmtRange(e.start, e.end)}</button>`).join('') + '</div>';
  showSheet(longDate(date), html, null, 'day');

  body.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => openEditor(date, el.dataset.edit));
  body.querySelectorAll('.chk input').forEach(cb => cb.onchange = () => {
    const e = db.entries.find(x => x.id === cb.dataset.e), i = +cb.dataset.i, s = doneSet(e, date);
    cb.checked ? s.add(i) : s.delete(i);

      e.skip = e.skip.filter(d => d !== date);

/* ================= Editor ================= */
function ask(title, msg, options, back) {   // options: [{label, cls, fn}]
  showSheet(title, `<div class="box">${msg}</div><div style="height:12px"></div>` +
    options.map((o, i) => `<button class="${o.cls || 'secondary'}" data-o="${i}">${o.label}</button>`).join(''), back);
  body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => options[+b.dataset.o].fn());
}

function openEditor(date, id) {
  const orig = id ? db.entries.find(x => x.id === id) : null;
  if (id && !orig) return openDay(date);
  const firstPlace = db.places[0];
  const e = orig ? clone(orig) : { date, placeId:firstPlace?.id || '', start:'', end:'', tasks:[''], note:'',
    remind:firstPlace ? firstPlace.remind : null, repeat:null, skip:[], extra:[], done:{} };
  const r = e.repeat || { freq:'none', days:[parse(date).getDay()], until:'' };
  const html = `
    <label>Place</label>
    <select id="fPlace">${db.places.map(p => `<option value="${esc(p.id)}" ${p.id === e.placeId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="__new">+ New place…</option></select>

    <label>Repeat</label>
    <select id="fFreq">

    </select>

    tasksEl.appendChild(row); return row;
  };
  (e.tasks.length ? e.tasks : ['']).forEach(t => addTask(t));

  };

  sel.onchange = () => {

  };

    if (sel.value === '__new') document.getElementById('fNewName').focus();
  });

  const readForm = () => {
    const f = freq.value;
    return {
      placeId: sel.value, start: document.getElementById('fStart').value, end: document.getElementById('fEnd').value,
      tasks: [...tasksEl.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean),
      note: document.getElementById('fNote').value.trim(), remind: readPicker('fRemind'),
      repeat: f === 'none' ? null : { freq:f, until:document.getElementById('fUntil').value,

    };
  };

      db.places.push(p);

    ], () => openEditor(date, id));

      { label:'Cancel', fn:() => openEditor(date, id) },
    ], () => openEditor(date, id));
  };
  document.getElementById('fCopy').onclick = () => openTransfer(date, orig, 'copy');
  document.getElementById('fMove').onclick = () => openTransfer(date, orig, 'move');
}

function openTransfer(from, e, kind) {
  const p = place(e.placeId), verb = kind === 'copy' ? 'Copy' : 'Move';
  const summary = `<b style="color:${esc(p.color)}">${esc(p.name)}</b> <span class="tm">${fmtRange(e.start, e.end)}</span>` +
    (e.tasks.length ? `<br>${e.tasks.map(esc).join(', ')}` : '');
  showSheet(`${verb} to another day`, `
    <div class="box">${summary}<div class="meta">From ${longDate(from)}</div></div>
    <label>${verb} to</label><input type="date" id="tDate">
    <div class="box" id="tCheck" style="display:none"></div>
    ${e.repeat ? `<div class="meta" style="margin-top:8px">This is a repeating item: only ${shortDate(from)} is ${kind === 'copy' ? 'copied' : 'moved'}. The rest of the series stays as it is.</div>` : ''}
    <div style="height:14px"></div>
    <button class="primary" id="tGo" disabled>Choose a day first</button>
    <button class="secondary" id="tCancel">Cancel</button>`, () => openEditor(from, e.id), 'other');
  const inp = document.getElementById('tDate'), go = document.getElementById('tGo'), chk = document.getElementById('tCheck');
  const endMin = x => toMin(x.end) ?? toMin(x.start) + 60;
  inp.oninput = () => {
    const to = inp.value;
    if (!to || to === from) { go.disabled = true; go.textContent = to === from ? 'Pick a different day' : 'Choose a day first'; chk.style.display = 'none'; return; }
    const clash = e.start ? entriesFor(to, true).filter(x => x !== e && x.start && toMin(x.start) < endMin(e) && toMin(e.start) < endMin(x)) : [];
    chk.style.display = ''; chk.innerHTML = `${verb} to <b>${longDate(to)}</b>?` +
      (clash.length ? `<div class="warn" style="margin-top:6px">⚠️ Overlaps with ${clash.map(x => esc(place(x.placeId).name) + ' ' + fmtRange(x.start, x.end)).join(', ')}</div>` : '');
    go.disabled = false; go.textContent = `Yes, ${verb.toLowerCase()} to ${shortDate(to)}`;
  };
  document.getElementById('tCancel').onclick = () => openEditor(from, e.id);
  go.onclick = () => {
    const to = inp.value; if (!to || to === from) return;
    withUndo(`${kind === 'copy' ? 'Copied' : 'Moved'} to ${shortDate(to)}`, () => {
      const copy = { ...clone(e), id:uid(), date:to, repeat:null, skip:[], extra:[], done:{} };
      db.entries.push(copy);
      if (kind === 'move') {
        if (e.done[from]) copy.done[to] = e.done[from];
        if (e.repeat) { e.extra = e.extra.filter(d => d !== from); if (occurs(e, from)) e.skip.push(from); }
        else db.entries = db.entries.filter(x => x !== e);
      }
    }, () => openDay(kind === 'move' ? to : from));
  };
}

/* ================= Search ================= */
function openSearch() {
  showSheet('Search', `<input type="search" id="q" placeholder="Patient, task, place, note…" autocomplete="off"><div id="results"></div>`, null, 'other');
  const q = document.getElementById('q'), out = document.getElementById('results');
  q.oninput = () => {
    const term = q.value.trim().toLowerCase();
    if (!term) { out.innerHTML = ''; return; }
    const today = todayIso();
    const rows = db.entries.filter(e => [place(e.placeId).name, e.note, ...e.tasks].some(s => (s || '').toLowerCase().includes(term)))
      .map(e => {
        let date = e.date;
        if (e.repeat) { date = null; for (let i = 0; i < 400; i++) { const d = addDays(today, i); if (occurs(e, d)) { date = d; break; } } }
        return { e, date };
      }).sort((a, b) => (a.date || '9').localeCompare(b.date || '9'));
    out.innerHTML = rows.length ? rows.map(({ e, date }) => `<div class="res" data-d="${date || ''}">
      <b style="color:${esc(place(e.placeId).color)}">${esc(place(e.placeId).name)}</b> <span class="tm">${fmtRange(e.start, e.end)}</span>
      ${e.tasks.length ? '<br>' + e.tasks.map(esc).join(', ') : ''}
      <small>${e.repeat ? `↻ ${repeatText(e.repeat)}${date ? ' · next ' + shortDate(date) : ''}` : longDate(e.date)}</small></div>`).join('')
      : '<div class="empty-msg">No matches.</div>';
    out.querySelectorAll('.res').forEach(r => r.onclick = () => { if (r.dataset.d) { cursor = parse(r.dataset.d); render(); openDay(r.dataset.d); } });
  };
  setTimeout(() => q.focus(), 250);
}
document.getElementById('searchBtn').onclick = openSearch;

/* ================= Reminders ================= */
function openReminders() {
  const placeOpts = `<option value="all">All places</option>` + db.places.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  showSheet('Reminders', `
    <div class="meta">To remind you of one item only, open it and pick a reminder in Edit. Use this to set reminders for many items at once.</div>
    <label>Set reminders for</label><select id="rPlace">${placeOpts}</select>
    <label>Remind me</label>${remindPicker('rWhen', 30)}
    <div style="height:12px"></div>
    <button class="primary" id="rApply">Apply</button>
    <div class="meta" style="margin-top:6px">Applies to everything already planned for that place, and to new items you add there.</div>

    <div class="lbl" style="margin-top:24px">🕌 Prayer reminders</div>
    ${PRAYERS.filter(([k]) => k !== 'sunrise').map(([k, n]) => `<div class="prow"><b>${n}</b><div>${remindPicker('pr_' + k, db.prayerRemind[k] ?? null, PRAYER_OPTS, 'At adhan time')}</div></div>`).join('')}
    <div class="two" style="margin-top:8px"><button class="secondary" id="prAll">Copy Fajr's setting to all</button><button class="primary" id="prSave" style="margin-top:8px">Save prayer reminders</button></div>

    <div class="lbl" style="margin-top:24px">Get alerts when the app is closed</div>
    <div class="box">Reminders pop up here while the app is open. To be alerted when it's closed, add them to your iPhone/iPad Calendar, and repeat after big changes.</div>
    <label>Which places</label><select id="xPlace">${placeOpts}<option value="none">None (prayers only)</option></select>
    <label class="chk" style="text-transform:none;letter-spacing:0;font-size:15px;color:inherit"><input type="checkbox" id="xPrayers" ${Object.values(db.prayerRemind).some(v => v != null) ? 'checked' : ''}> Include prayer reminders</label>
    <button class="secondary" id="rExport">📅 Add next 3 months to Calendar</button>
    ${perm === 'default' ? '<button class="secondary" id="rPerm">Allow pop-up notifications</button>' : ''}`, null, 'other');
  wirePicker('rWhen');
  const pks = PRAYERS.filter(([k]) => k !== 'sunrise').map(([k]) => k);
  pks.forEach(k => wirePicker('pr_' + k));
  document.getElementById('prAll').onclick = () => {
    const src = document.getElementById('pr_fajr');
    pks.forEach(k => {
      document.getElementById('pr_' + k).value = src.value;
      document.getElementById('pr_' + k + 'C').style.display = src.value === 'custom' ? '' : 'none';
      document.getElementById('pr_' + k + 'N').value = document.getElementById('pr_fajrN').value;
      document.getElementById('pr_' + k + 'U').value = document.getElementById('pr_fajrU').value;
    });
  };
  document.getElementById('prSave').onclick = () => {
    const vals = {}; for (const k of pks) { const v = readPicker('pr_' + k); if (v === undefined) return toast('Type how many minutes before'); vals[k] = v; }
    withUndo('Prayer reminders saved', () => { db.prayerRemind = vals; });
    document.getElementById('xPrayers').checked = Object.values(vals).some(v => v != null);
  };
  document.getElementById('rApply').onclick = () => {
    const pid = document.getElementById('rPlace').value, val = readPicker('rWhen');
    if (val === undefined) return toast('Type how long before you want the reminder');
    withUndo(`Reminders set: ${remindLabel(val)}`, () => {
      db.entries.forEach(e => { if (pid === 'all' || e.placeId === pid) e.remind = val; });

document.getElementById('remBtn').onclick = openReminders;

const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
const fmtHM = m => `${pad(Math.min(23, Math.floor(m / 60)))}:${pad(m % 60)}`;
function buildICS(pid, from, days, prayers) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Timetable//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Timetable'];
  let n = 0;
  for (let i = 0; i < days; i++) {
    const date = addDays(from, i), ymd = date.replace(/-/g, '');
    entriesFor(date, true).forEach(e => {
      if (e.remind == null || pid === 'none' || (pid !== 'all' && e.placeId !== pid)) return;
      const p = place(e.placeId);
      lines.push('BEGIN:VEVENT', `UID:${e.id}-${ymd}@timetable`, `DTSTAMP:${stamp}`);
      if (e.start) {
        const end = e.end || fmtHM(toMin(e.start) + 60);
        lines.push(`DTSTART;TZID=Africa/Cairo:${ymd}T${e.start.replace(':', '')}00`, `DTEND;TZID=Africa/Cairo:${ymd}T${end.replace(':', '')}00`);
      } else lines.push(`DTSTART;VALUE=DATE:${ymd}`, `DTEND;VALUE=DATE:${addDays(date, 1).replace(/-/g, '')}`);
      lines.push(`SUMMARY:${icsEsc(p.name)}`, `DESCRIPTION:${icsEsc([...e.tasks, e.note].filter(Boolean).join('\n'))}`,
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(p.name)}`, `TRIGGER:-PT${e.remind}M`, 'END:VALARM', 'END:VEVENT');
      n++;
    });
    if (prayers) {
      const pt = prayerTimes(date);
      PRAYERS.forEach(([k, name]) => {
        const m = db.prayerRemind[k]; if (m == null) return;
        const t = pt[k].replace(':', '');
        lines.push('BEGIN:VEVENT', `UID:prayer-${k}-${ymd}@timetable`, `DTSTAMP:${stamp}`,
          `DTSTART;TZID=Africa/Cairo:${ymd}T${t}00`, `DTEND;TZID=Africa/Cairo:${ymd}T${t}00`, `SUMMARY:🕌 ${name}`,
          'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${name}`, `TRIGGER:-PT${m}M`, 'END:VALARM', 'END:VEVENT');
        n++;
      });
    }
  }
  lines.push('END:VCALENDAR');
  return { text: lines.join('\r\n'), n };
}
async function exportICS(pid, prayers) {
  const { text, n } = buildICS(pid, todayIso(), 92, prayers);
  if (!n) return toast(prayers ? 'Nothing to add: set some reminders first' : 'No items with reminders in the next 3 months');
  await saveFile('timetable-reminders.ics', text, 'text/calendar');
}

const fired = new Set();
function checkReminders() {
  const now = Date.now();
  const maxDays = Math.min(60, Math.ceil(Math.max(0, ...db.entries.map(e => e.remind || 0)) / 1440) + 1);
  for (let off = 0; off <= 1; off++) {
    const date = addDays(todayIso(), off), pt = prayerTimes(date);
    PRAYERS.forEach(([k, name]) => {
      const m = db.prayerRemind[k]; if (m == null) return;
      const d = parse(date); d.setMinutes(toMin(pt[k])); const at = d.getTime() - m * 60000, key = 'pr' + k + date + m;
      if (now >= at && now < at + 15 * 60000 && !fired.has(key)) {
        fired.add(key);
        const msg = m ? `🕌 ${name} in ${remindLabel(m).replace(' before', '')} (${fmtTime(pt[k])})` : `🕌 It's time for ${name}`;
        toast(msg, null, 15000);
        try { if ('Notification' in window && Notification.permission === 'granted') new Notification(msg); } catch (er) {}
      }
    });
  }
  [...Array(maxDays + 1)].map((_, i) => addDays(todayIso(), i)).forEach(date => entriesFor(date, true).forEach(e => {
    if (e.remind == null) return;
    const d = parse(date); d.setMinutes(toMin(e.start) ?? 8 * 60);
    const at = d.getTime() - e.remind * 60000, key = e.id + date + e.remind;
    if (now >= at && now < at + 15 * 60000 && !fired.has(key)) {
      fired.add(key);
      const days = Math.round((parse(date) - parse(todayIso())) / 864e5);
      const msg = `⏰ ${place(e.placeId).name}${e.start ? ' at ' + fmtTime(e.start) : ''}${days === 1 ? ' tomorrow' : days > 1 ? ' on ' + shortDate(date) : ''}`;
      toast(msg, null, 15000);
      try { if ('Notification' in window && Notification.permission === 'granted') new Notification(msg, { body: e.tasks.join(', ') }); } catch (er) {}
    }
  }));
}

/* ================= Places & settings ================= */
function openSettings() {
  const rows = db.places.map(p => `<div class="place-row" data-id="${esc(p.id)}"><input type="color" value="${esc(p.color)}"><input type="text"><button aria-label="Delete">−</button></div>`).join('');
  showSheet('Places & colors', `
    <div id="pl">${rows}</div>
    <button class="add-small" id="plAdd" style="margin-top:8px">+ Add place</button>
    <div style="height:12px"></div><button class="primary" id="plSave">Save</button>
    <div class="lbl" style="margin-top:24px">Backup</div>
    <div class="two"><button class="secondary" id="exp">Download backup</button><button class="secondary" id="imp">Restore backup</button></div>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none">
    <div class="meta" style="margin-top:14px">Prayer times are calculated for Alexandria (Egyptian General Authority of Survey method) and follow summer/winter time automatically. They may differ by a minute or two from your local mosque.</div>`, null, 'other');
  const pl = document.getElementById('pl');
  pl.querySelectorAll('.place-row').forEach(r => r.querySelector('input[type=text]').value = place(r.dataset.id).name);
  const wire = r => r.querySelector('button').onclick = () => {
    const pid = r.dataset.id;
    if (pid && db.entries.some(e => e.placeId === pid) && !r.dataset.warned) {
      r.dataset.warned = 1; toast('This place is used in your calendar. Tap − again to remove it.'); return;
    }
    r.remove();
  };
  pl.querySelectorAll('.place-row').forEach(wire);
  document.getElementById('plAdd').onclick = () => {
    pl.insertAdjacentHTML('beforeend', `<div class="place-row" data-id=""><input type="color" value="#3aa0d8"><input type="text" placeholder="Place name"><button aria-label="Delete">−</button></div>`);
    const r = pl.lastElementChild; wire(r); r.querySelector('input[type=text]').focus();
  };
  document.getElementById('plSave').onclick = () => {
    const places = [...pl.querySelectorAll('.place-row')].map(r => {
      const old = db.places.find(p => p.id === r.dataset.id);
      return { id:r.dataset.id || uid(), color:r.querySelector('input[type=color]').value, name:r.querySelector('input[type=text]').value.trim(), remind:old ? old.remind : null };
    }).filter(p => p.name);
    withUndo('Places saved', () => { db.places = places; ui.filter = ui.filter.filter(id => places.some(p => p.id === id)); saveUI(); }, closeSheet);
  };
  document.getElementById('exp').onclick = () => saveFile(`timetable-backup-${todayIso()}.json`, JSON.stringify(db, null, 2), 'application/json');
  const f = document.getElementById('impFile');
  document.getElementById('imp').onclick = () => f.click();
  f.onchange = async () => {
    try {
      const d = JSON.parse(await f.files[0].text()); if (!d.places || !d.entries) throw 0;
      withUndo('Backup restored', () => { db = normalize(d); }, closeSheet);
    } catch (e) { toast('That file is not a valid backup.'); }
  };
}
document.getElementById('setBtn').onclick = openSettings;

/* ================= Files ================= */
let downloadsCap = null;
async function saveFile(name, text, mime) {
  if (downloadsCap) {
    try { await downloadsCap.save({ filename:name, data:text }); return; }
    catch (e) { toast('Download cancelled'); return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:mime })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ================= Cloud sync (when opened as a Claude page) ================= */
let remoteRef = null, writing = false, pending = false, pushTimer = null;
const setSync = t => { document.getElementById('sync').textContent = t; };
function schedulePush() { if (!remoteRef) return; clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, 700); }
async function pushRemote() {
  if (!remoteRef) return;
  if (writing) { pending = true; return; }
  writing = true; setSync('Syncing…');
  try { await remoteRef.set({ json: JSON.stringify(db), updated: db.updated }); setSync('☁︎ Synced'); }
  catch (e) { setSync(e && e.code === 'quota_exceeded' ? '⚠️ Cloud storage full' : 'Saved on this device'); }
  writing = false;
  if (pending) { pending = false; pushRemote(); }
}
async function initCloud() {
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  window.claude.use('downloads').then(d => { downloadsCap = d; }).catch(() => {});
  let cdb, user;
  try { [cdb, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
  if (!cdb || !user) return;
  const id = await user.id(); if (!id) return;
  remoteRef = cdb.doc(`data/users/${id}/timetable`);
  setSync('Connecting…');
  const timer = setTimeout(() => setSync('Offline · saved on this device'), 10000);
  remoteRef.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.exists) { if (!snap.metadata.fromCache) pushRemote(); return; }
    let r; try { r = JSON.parse(snap.data().json); } catch (e) { return; }
    if ((r.updated || 0) > db.updated) {
      db = normalize(r); saveLocal();
      if (sheetMode === 'day') openDay(sheetDay); else if (!sheetMode) render(); else renderChips();
    } else if ((r.updated || 0) < db.updated) { pushRemote(); return; }
    if (!snap.metadata.fromCache) setSync('☁︎ Synced');
  }, () => { clearTimeout(timer); remoteRef = null; setSync('Saved on this device'); });
}

/* ================= Start ================= */
render();
initCloud();
let lastDay = todayIso();
setInterval(() => {
  checkReminders(); updateNextPrayer();
  if (todayIso() !== lastDay) { lastDay = todayIso(); if (!sheetMode) render(); }
}, 30000);
setTimeout(checkReminders, 1500);
